project_id = "elm-app"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = false
enable_confirmations = false

[functions.send-email]
verify_jwt = false

[functions.welcome-email]
verify_jwt = false

[functions.whatsapp-webhook]
verify_jwt = false

[functions.daily-services-report]
verify_jwt = false

# Cible du redirect_uri de Meta et TikTok : la plateforme redirige un navigateur
# ici, sans session Supabase. La sécurité repose sur le `state` à usage unique.
[functions.marketing-oauth-callback]
verify_jwt = false

# Appelée par le cron avec CRON_SECRET, qui n'est pas un JWT. L'appel depuis
# l'app reste protégé : la function valide elle-même le JWT quand l'en-tête
# n'est pas le secret du cron.
[functions.marketing-sync-metrics]
verify_jwt = false
