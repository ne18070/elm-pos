name: Mobile Boutique — Play Store

# Publie « ELM Boutique » (app Flutter buyer_app/, com.elmapp.mobile) sur Google Play.
# C'est la vitrine acheteur : ouvrir une boutique ELM, commander, voir la confirmation.
#
# Déclenchement :
#   git tag mobile-v1.2.0 && git push origin mobile-v1.2.0   → Android + iOS (mobile-ios.yml)
#   ou manuellement : Actions → « Mobile Boutique — Play Store » → Run workflow
#
# Projets natifs : android/ et ios/ ne sont pas commités — ils sont générés par
# `flutter create` puis configurés par buyer_app/tool/configure_platforms.py
# (applicationId com.elmapp.mobile, signature release, nom « ELM Boutique »).
#
# Versionnement :
#   versionName = tag sans le préfixe « mobile-v » (ou l'input `version` en manuel)
#   versionCode = github.run_number + vars.ANDROID_VERSION_CODE_OFFSET (défaut 100)
#     → doit dépasser le versionCode des builds Capacitor déjà publiés. Si Play refuse
#       « version code already used », augmente ANDROID_VERSION_CODE_OFFSET
#       (Settings → Secrets and variables → Actions → Variables).
#
# Secrets requis :
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY  (passés en --dart-define)
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#     → la MÊME clé que l'app Capacitor (elm-release.jks), sinon Play refuse la mise à jour.
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON — JSON du compte de service Google Cloud.
#     1. Play Console → Configuration → Accès API → relier/créer un projet Google Cloud
#     2. Google Cloud Console → IAM et administration → Comptes de service → Créer
#     3. Sur ce compte de service → Clés → Ajouter une clé → JSON → télécharger
#     4. Play Console → Utilisateurs et autorisations → inviter l'e-mail du compte de
#        service → droits « Release Manager » sur com.elmapp.mobile
#     5. Coller le contenu brut du JSON dans le secret GitHub

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'versionName (ex: 1.2.0)'
        required: true
      track:
        description: 'Piste Google Play'
        type: choice
        options: [production, beta, alpha, internal]
        default: production

concurrency:
  group: mobile-android
  cancel-in-progress: false

defaults:
  run:
    working-directory: buyer_app

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NAME="${{ inputs.version }}"
          else
            NAME="${GITHUB_REF_NAME#mobile-v}"
          fi
          if ! echo "$NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: version '$NAME' invalide — attendu X.Y.Z (tag mobile-vX.Y.Z)"
            exit 1
          fi
          CODE=$(( ${{ github.run_number }} + ${{ vars.ANDROID_VERSION_CODE_OFFSET || 100 }} ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Android versionName=$NAME versionCode=$CODE"

      - name: Check required secrets
        run: |
          for s in SUPABASE_URL SUPABASE_ANON_KEY ANDROID_KEYSTORE_BASE64 GOOGLE_PLAY_SERVICE_ACCOUNT_JSON; do
            if [ -z "${!s}" ]; then echo "ERROR: secret manquant pour $s"; exit 1; fi
          done
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate & configure native projects
        run: |
          flutter create --org com.elmapp --project-name elm_boutique --platforms android,ios .
          python3 tool/configure_platforms.py

      - name: Launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze & test
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PYEOF'
          import base64, os, sys, re
          raw = os.environ.get('KEYSTORE_B64', '')
          d = re.sub(r'[^A-Za-z0-9+/]', '', raw)   # keep only base64 alphabet
          rem = len(d) % 4
          if rem == 1:
              print(f"ERROR: ANDROID_KEYSTORE_BASE64 secret is corrupted ({len(d)} data chars, len%4=1). Re-encode with: [Convert]::ToBase64String([IO.File]::ReadAllBytes('elm-release.jks'))", file=sys.stderr)
              sys.exit(1)
          d += '=' * ((4 - rem) % 4)
          open('android/upload.jks', 'wb').write(base64.b64decode(d))
          print(f"Keystore decoded: {os.path.getsize('android/upload.jks')} bytes")
          PYEOF

      - name: Write key.properties
        run: |
          printf 'storeFile=../upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_ALIAS }}" \
            "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            > android/key.properties

      - name: Build signed AAB
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }} \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY"

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-boutique-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: buyer_app/build/app/outputs/bundle/release/app-release.aab
          retention-days: 30

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.elmapp.mobile
          releaseFiles: buyer_app/build/app/outputs/bundle/release/app-release.aab
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          track: ${{ inputs.track || 'production' }}
          status: completed

      - name: Clean up signing material
        if: always()
        run: rm -f android/upload.jks android/key.properties
