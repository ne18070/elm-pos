name: Mobile Boutique — Android (APK)

# Compile « ELM Boutique » (app Flutter buyer_app/, com.elmapp.mobile) en APK signé et le
# publie HORS Play Store : bucket Supabase public « app-releases » (migration 159).
# Lien à partager : https://www.elm-app.click/telecharger (lit android/latest.json).
# L'app compare sa version à latest.json au démarrage et propose la mise à jour.
#
# Déclenchement :
#   git tag mobile-v1.2.0 && git push origin mobile-v1.2.0   → Android + iOS (mobile-ios.yml)
#   ou manuellement : Actions → « Mobile Boutique — Android (APK) » → Run workflow
#
# Projets natifs : android/ et ios/ ne sont pas commités — générés par `flutter create`
# puis configurés par buyer_app/tool/configure_platforms.py.
#
# Versionnement :
#   versionName = tag sans le préfixe « mobile-v » (ou l'input `version` en manuel)
#   versionCode = github.run_number + vars.ANDROID_VERSION_CODE_OFFSET (défaut 100)
#     → doit toujours augmenter : Android refuse d'installer une mise à jour de versionCode inférieur.
#
# Secrets requis :
#   NEXT_PUBLIC_SUPABASE_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY  (passés en --dart-define)
#   SUPABASE_SERVICE_ROLE_KEY — dépôt de l'APK dans le bucket app-releases
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD
#     → toujours la MÊME clé (elm-release.jks) : Android refuse une mise à jour signée autrement.
#   GOOGLE_PLAY_SERVICE_ACCOUNT_JSON — uniquement si un jour publication Play Store (input play_track)
#
# Variables (Settings → Secrets and variables → Actions → Variables), notifications push :
#   FIREBASE_API_KEY, FIREBASE_PROJECT_ID, FIREBASE_MESSAGING_SENDER_ID, FIREBASE_ANDROID_APP_ID
#   (Console Firebase → Paramètres du projet → Vos applications → app Android com.elmapp.mobile).
#   Absentes : l'app fonctionne, sans notifications.

on:
  push:
    tags:
      - 'mobile-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'versionName (ex: 1.2.0)'
        required: true
      play_track:
        description: 'Publier aussi sur Google Play ?'
        type: choice
        options: [aucune, internal, alpha, beta, production]
        default: aucune

concurrency:
  group: mobile-android
  cancel-in-progress: false

defaults:
  run:
    working-directory: buyer_app

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    env:
      PLAY_TRACK: ${{ inputs.play_track || 'aucune' }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            NAME="${{ inputs.version }}"
          else
            NAME="${GITHUB_REF_NAME#mobile-v}"
          fi
          if ! echo "$NAME" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "ERROR: version '$NAME' invalide — attendu X.Y.Z (tag mobile-vX.Y.Z)"
            exit 1
          fi
          CODE=$(( ${{ github.run_number }} + ${{ vars.ANDROID_VERSION_CODE_OFFSET || 100 }} ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Android versionName=$NAME versionCode=$CODE"

      - name: Check required secrets
        run: |
          for s in SUPABASE_URL SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY ANDROID_KEYSTORE_BASE64; do
            if [ -z "${!s}" ]; then echo "ERROR: secret manquant pour $s"; exit 1; fi
          done
          if [ "$PLAY_TRACK" != "aucune" ] && [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_JSON" ]; then
            echo "ERROR: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON requis pour publier sur Google Play"; exit 1
          fi
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate & configure native projects
        run: |
          flutter create --org com.elmapp --project-name elm_boutique --platforms android,ios .
          python3 tool/configure_platforms.py

      - name: Launcher icons
        run: dart run flutter_launcher_icons

      - name: Analyze & test
        run: |
          flutter analyze --no-fatal-infos
          flutter test

      - name: Decode keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          python3 - <<'PYEOF'
          import base64, os, sys, re
          raw = os.environ.get('KEYSTORE_B64', '')
          d = re.sub(r'[^A-Za-z0-9+/]', '', raw)   # keep only base64 alphabet
          rem = len(d) % 4
          if rem == 1:
              print(f"ERROR: ANDROID_KEYSTORE_BASE64 secret is corrupted ({len(d)} data chars, len%4=1). Re-encode with: [Convert]::ToBase64String([IO.File]::ReadAllBytes('elm-release.jks'))", file=sys.stderr)
              sys.exit(1)
          d += '=' * ((4 - rem) % 4)
          open('android/upload.jks', 'wb').write(base64.b64decode(d))
          print(f"Keystore decoded: {os.path.getsize('android/upload.jks')} bytes")
          PYEOF

      - name: Write key.properties
        run: |
          printf 'storeFile=../upload.jks\nstorePassword=%s\nkeyAlias=%s\nkeyPassword=%s\n' \
            "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" \
            "${{ secrets.ANDROID_KEY_ALIAS }}" \
            "${{ secrets.ANDROID_KEY_PASSWORD }}" \
            > android/key.properties

      - name: Dart defines
        id: defines
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY"
            echo "FIREBASE_API_KEY=${{ vars.FIREBASE_API_KEY }}"
            echo "FIREBASE_PROJECT_ID=${{ vars.FIREBASE_PROJECT_ID }}"
            echo "FIREBASE_MESSAGING_SENDER_ID=${{ vars.FIREBASE_MESSAGING_SENDER_ID }}"
            echo "FIREBASE_ANDROID_APP_ID=${{ vars.FIREBASE_ANDROID_APP_ID }}"
          } > "$RUNNER_TEMP/dart-defines.env"

      - name: Build signed APK
        run: |
          flutter build apk --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }} \
            --dart-define-from-file="$RUNNER_TEMP/dart-defines.env"

      - name: Publish APK (bucket Supabase app-releases)
        env:
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VERSION: ${{ steps.version.outputs.name }}
          BUILD: ${{ steps.version.outputs.code }}
        run: |
          APK=build/app/outputs/flutter-apk/app-release.apk
          NAME="elm-boutique-$VERSION-$BUILD.apk"
          BASE="${SUPABASE_URL%/}/storage/v1/object/app-releases/android"
          echo "APK : $(du -h "$APK" | cut -f1)"
          # Clé service : ancien format (JWT « eyJ… », aussi en Authorization) ou nouveau
          # format Supabase (« sb_secret_… », en-tête apikey uniquement : ce n'est pas un JWT)
          AUTH=(-H "apikey: $SERVICE_KEY")
          case "$SERVICE_KEY" in eyJ*) AUTH+=(-H "Authorization: Bearer $SERVICE_KEY");; esac
          upload() { # $1 = fichier local, $2 = nom distant, $3 = type, $4 = cache-control
            local status
            status=$(curl --silent --show-error -o "$RUNNER_TEMP/upload-response.json" -w '%{http_code}' \
              -X POST "$BASE/$2" "${AUTH[@]}" \
              -H "Content-Type: $3" -H "x-upsert: true" -H "cache-control: $4" \
              --data-binary "@$1")
            if [ "$status" -ge 300 ]; then
              echo "ERROR: dépôt de $2 refusé par Supabase (HTTP $status) :"
              cat "$RUNNER_TEMP/upload-response.json"; echo
              echo "→ Bucket not found : appliquer la migration 159 (bucket app-releases)."
              echo "→ Invalid JWT / Compact JWS / Unauthorized : vérifier le secret SUPABASE_SERVICE_ROLE_KEY."
              echo "→ exceeded the maximum allowed size : relever la limite de taille des fichiers du projet"
              echo "  (Supabase → Storage → Settings), ou publier des APK par architecture (--split-per-abi)."
              exit 1
            fi
          }
          upload "$APK" "$NAME" application/vnd.android.package-archive "max-age=31536000"
          python3 - "$APK" "$NAME" <<'PYEOF'
          import json, os, sys
          from datetime import datetime, timezone
          apk, name = sys.argv[1], sys.argv[2]
          json.dump({
              'version': os.environ['VERSION'],
              'build': int(os.environ['BUILD']),
              'apk': name,
              'size_bytes': os.path.getsize(apk),
              'published_at': datetime.now(timezone.utc).isoformat(),
          }, open('latest.json', 'w'))
          PYEOF
          # Publié en dernier : la page /telecharger et l'app ne voient la version que l'APK une fois en ligne
          upload latest.json latest.json application/json "max-age=60"
          echo "APK publié : ${SUPABASE_URL%/}/storage/v1/object/public/app-releases/android/$NAME"
          echo "### APK $VERSION ($BUILD) publié — lien à partager : https://www.elm-app.click/telecharger" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-boutique-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: buyer_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

      # ── Optionnel : Google Play ────────────────────────────────────────────
      - name: Build signed AAB (Google Play)
        if: env.PLAY_TRACK != 'aucune'
        run: |
          flutter build appbundle --release \
            --build-name=${{ steps.version.outputs.name }} \
            --build-number=${{ steps.version.outputs.code }} \
            --dart-define-from-file="$RUNNER_TEMP/dart-defines.env"

      - name: Upload to Google Play
        if: env.PLAY_TRACK != 'aucune'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.elmapp.mobile
          releaseFiles: buyer_app/build/app/outputs/bundle/release/app-release.aab
          releaseName: ${{ steps.version.outputs.name }} (${{ steps.version.outputs.code }})
          track: ${{ env.PLAY_TRACK }}
          status: completed

      - name: Clean up signing material
        if: always()
        run: rm -f android/upload.jks android/key.properties "$RUNNER_TEMP/dart-defines.env"
