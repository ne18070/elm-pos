name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        # Même version que release.yml / Electron 31 — lts/* a cassé l'installation début septembre
        node-version: '20'
        cache: 'yarn'
    - name: Install system dependencies
      run: sudo apt-get update && sudo apt-get install -y libudev-dev libusb-1.0-0-dev
    - name: Install dependencies
      # Comme release.yml : --ignore-engines (dépendances qui annoncent une autre version de Node),
      # et pas d'electron-rebuild — les tests visent la version web.
      run: npm install -g yarn && yarn install --ignore-engines --network-timeout 100000
      env:
        SKIP_ELECTRON_REBUILD: '1'
    - name: Install Playwright Browsers
      run: yarn playwright install --with-deps
    - name: Run Playwright tests
      run: yarn playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30
